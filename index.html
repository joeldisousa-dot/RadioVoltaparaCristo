  <!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Rádio Onda Livre</title>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

      min-height: 100vh;

      background:
        linear-gradient(
          135deg,
          #071a33 0%,
          #0b315a 45%,
          #09223f 100%
        );

      color: #ffffff;

      padding: 30px 15px;
    }

    .container {
      width: 100%;
      max-width: 850px;
      margin: 0 auto;
    }

    /* =====================================================
       CABEÇALHO
    ===================================================== */

    .header {
      text-align: center;
      margin-bottom: 25px;
    }

    .microphone {
      width: 72px;
      height: 72px;

      margin: 0 auto 15px;

      border-radius: 50%;

      display: flex;
      align-items: center;
      justify-content: center;

      background:
        rgba(255,255,255,.10);

      border:
        1px solid rgba(255,255,255,.15);

      box-shadow:
        0 10px 30px rgba(0,0,0,.25);

      font-size: 34px;
    }

    .header h1 {
      font-size: 30px;
      font-weight: 700;
      letter-spacing: .2px;
    }

    .subtitle {
      margin-top: 7px;

      color: #b8d3ed;

      font-size: 14px;
    }

    /* =====================================================
       PLAYER
    ===================================================== */

    .player-card {
      background:
        rgba(255,255,255,.09);

      border:
        1px solid rgba(255,255,255,.14);

      border-radius: 22px;

      padding: 24px;

      backdrop-filter: blur(12px);

      box-shadow:
        0 18px 45px rgba(0,0,0,.25);

      margin-bottom: 22px;
    }

    .status {
      display: flex;
      align-items: center;
      justify-content: center;

      gap: 8px;

      margin-bottom: 13px;

      color: #b7d7ee;

      font-size: 12px;
    }

    .status-dot {
      width: 9px;
      height: 9px;

      border-radius: 50%;

      background: #4ade80;

      box-shadow:
        0 0 10px rgba(74,222,128,.7);
    }

    .current-type {
      text-align: center;

      color: #7fb7e8;

      font-size: 12px;

      text-transform: uppercase;

      letter-spacing: 1.2px;

      margin-bottom: 6px;
    }

    .current-title {
      text-align: center;

      font-size: 21px;

      font-weight: 700;

      line-height: 1.35;
    }

    .current-artist {
      text-align: center;

      margin-top: 5px;

      color: #b8d3ed;

      font-size: 14px;
    }

    /* =====================================================
       AVISO PARA INICIAR ÁUDIO
    ===================================================== */

    .play-hint {
      margin-top: 10px;

      color: #7fb7e8;

      font-size: 13px;

      font-weight: 500;

      opacity: .95;

      text-align: center;
    }

    /* =====================================================
       AUDIO
    ===================================================== */

    #audioPlayer {
      width: 100%;

      margin-top: 20px;

      border-radius: 10px;
    }

    /* =====================================================
       CONTROLES
    ===================================================== */

    .controls {
      display: flex;

      justify-content: center;

      align-items: center;

      gap: 12px;

      margin-top: 17px;
    }

    .control-btn {
      border: none;

      width: 45px;
      height: 45px;

      border-radius: 50%;

      background: rgba(255,255,255,.12);

      color: #ffffff;

      font-size: 17px;

      cursor: pointer;

      transition:
        transform .2s,
        background .2s;
    }

    .control-btn:hover {
      background: rgba(255,255,255,.20);

      transform: translateY(-2px);
    }

    .control-btn:active {
      transform: scale(.96);
    }

    /* =====================================================
       FILTROS
    ===================================================== */

    .filters {
      display: flex;

      justify-content: center;

      flex-wrap: wrap;

      gap: 8px;

      margin-bottom: 18px;
    }

    .filter-btn {
      border: 1px solid rgba(255,255,255,.15);

      background: rgba(255,255,255,.07);

      color: #c7dcef;

      padding: 9px 15px;

      border-radius: 30px;

      font-size: 13px;

      cursor: pointer;

      transition:
        background .2s,
        color .2s,
        transform .2s;
    }

    .filter-btn:hover {
      background: rgba(255,255,255,.13);

      transform: translateY(-1px);
    }

    .filter-btn.active {
      background: #1976d2;

      border-color: #1976d2;

      color: #ffffff;
    }

    /* =====================================================
       LISTA
    ===================================================== */

    .playlist {
      display: flex;

      flex-direction: column;

      gap: 10px;
    }

    .audio-item {
      display: flex;

      align-items: center;

      gap: 14px;

      padding: 14px 16px;

      border-radius: 15px;

      background: rgba(255,255,255,.07);

      border:
        1px solid rgba(255,255,255,.08);

      cursor: pointer;

      transition:
        background .2s,
        transform .2s,
        border-color .2s;
    }

    .audio-item:hover {
      background: rgba(255,255,255,.12);

      transform: translateY(-1px);

      border-color:
        rgba(255,255,255,.15);
    }

    .audio-item.active {
      background:
        rgba(25,118,210,.28);

      border-color:
        rgba(76,160,230,.55);
    }

    .audio-icon {
      width: 42px;
      height: 42px;

      flex-shrink: 0;

      border-radius: 12px;

      display: flex;

      align-items: center;

      justify-content: center;

      background:
        rgba(255,255,255,.10);

      font-size: 19px;
    }

    .audio-info {
      flex: 1;

      min-width: 0;
    }

    .audio-title {
      font-size: 14px;

      font-weight: 600;

      color: #ffffff;

      white-space: nowrap;

      overflow: hidden;

      text-overflow: ellipsis;
    }

    .audio-artist {
      margin-top: 4px;

      font-size: 12px;

      color: #a9c4dd;

      white-space: nowrap;

      overflow: hidden;

      text-overflow: ellipsis;
    }

    .audio-type {
      font-size: 10px;

      color: #79b7e8;

      margin-top: 4px;

      text-transform: uppercase;

      letter-spacing: .8px;
    }

    .play-icon {
      width: 34px;
      height: 34px;

      flex-shrink: 0;

      display: flex;

      align-items: center;

      justify-content: center;

      border-radius: 50%;

      background:
        rgba(255,255,255,.10);

      color: #ffffff;

      font-size: 13px;
    }

    /* =====================================================
       MENSAGENS
    ===================================================== */

    .message {
      text-align: center;

      padding: 25px 15px;

      color: #a9c4dd;

      font-size: 14px;
    }

    .error {
      color: #ffb4b4;
    }

    /* =====================================================
       LOADING
    ===================================================== */

    .loading {
      display: flex;

      justify-content: center;

      align-items: center;

      gap: 9px;

      padding: 25px;

      color: #b8d3ed;

      font-size: 14px;
    }

    .spinner {
      width: 18px;
      height: 18px;

      border:
        2px solid rgba(255,255,255,.20);

      border-top-color: #ffffff;

      border-radius: 50%;

      animation:
        girar .8s linear infinite;
    }

    @keyframes girar {

      to {
        transform: rotate(360deg);
      }

    }

    /* =====================================================
       RODAPÉ
    ===================================================== */

    footer {
      text-align: center;

      margin-top: 30px;

      color: #7898b5;

      font-size: 11px;
    }

    /* =====================================================
       RESPONSIVO
    ===================================================== */

    @media (max-width: 600px) {

      body {
        padding: 20px 12px;
      }

      .header h1 {
        font-size: 26px;
      }

      .microphone {
        width: 64px;
        height: 64px;

        font-size: 30px;
      }

      .player-card {
        padding: 19px;
      }

      .current-title {
        font-size: 18px;
      }

      .audio-item {
        padding: 12px;
      }

      .audio-icon {
        width: 38px;
        height: 38px;
      }

    }

  </style>

</head>

<body>

  <div class="container">

    <!-- ===================================================
         CABEÇALHO
    ==================================================== -->

    <header class="header">

      <div class="microphone">
        🎙️
      </div>

      <h1>
        Rádio Onda Livre
      </h1>

      <div class="subtitle">
        Música, oração e mensagens para o seu dia
      </div>

    </header>


    <!-- ===================================================
         PLAYER
    ==================================================== -->

    <section class="player-card">

      <div class="status">

        <span
          id="statusDot"
          class="status-dot">
        </span>

        <span id="statusText">
          Carregando programação...
        </span>

      </div>


      <div
        id="currentType"
        class="current-type">
        Rádio Onda Livre
      </div>


      <div
        id="currentTitle"
        class="current-title">

        Escolha um áudio para ouvir

      </div>


      <div
        id="playHint"
        class="play-hint">

        ▶ Clique em uma música ou oração abaixo para iniciar o áudio

      </div>


      <div
        id="currentArtist"
        class="current-artist">
      </div>


      <audio
        id="audioPlayer"
        controls
        preload="metadata">
      </audio>


      <div class="controls">

        <button
          class="control-btn"
          type="button"
          onclick="anterior()"
          title="Anterior">

          ⏮

        </button>


        <button
          class="control-btn"
          type="button"
          onclick="proximo()"
          title="Próximo">

          ⏭

        </button>

      </div>

    </section>


    <!-- ===================================================
         FILTROS
    ==================================================== -->

    <div class="filters">

      <button
        type="button"
        class="filter-btn active"
        onclick="filtrar('todos', this)">

        Todos

      </button>


      <button
        type="button"
        class="filter-btn"
        onclick="filtrar('musica', this)">

        🎵 Músicas

      </button>


      <button
        type="button"
        class="filter-btn"
        onclick="filtrar('oracao', this)">

        🙏 Orações

      </button>

    </div>


    <!-- ===================================================
         PLAYLIST
    ==================================================== -->

    <div id="playlist">

      <div class="loading">

        <span class="spinner"></span>

        Carregando áudios...

      </div>

    </div>


    <!-- ===================================================
         RODAPÉ
    ==================================================== -->

    <footer>

      Rádio Onda Livre • Música, oração e mensagens

    </footer>

  </div>


  <script>

    /* =====================================================
       CONFIGURAÇÃO
    ===================================================== */

    const URL_API =
       'https://script.google.com/macros/s/AKfycby4tIS3B07OIcPVoCgKde_EL6PHkRXp46nMMNVh0yYxoYlpcSQeXbBqjLQ6vvVfnJcX4Q/exec';


    /* =====================================================
       ELEMENTOS
    ===================================================== */

    const player =
      document.getElementById('audioPlayer');

    const playlistElement =
      document.getElementById('playlist');

    const statusText =
      document.getElementById('statusText');

    const statusDot =
      document.getElementById('statusDot');

    const currentTitle =
      document.getElementById('currentTitle');

    const currentArtist =
      document.getElementById('currentArtist');

    const currentType =
      document.getElementById('currentType');

    const playHint =
      document.getElementById('playHint');


    /* =====================================================
       VARIÁVEIS
    ===================================================== */

    let playlist = [];

    let playlistFiltrada = [];

    let filtroAtual = 'todos';

    let indiceAtual = -1;


    /* =====================================================
       INICIALIZAÇÃO
    ===================================================== */

    document.addEventListener(
      'DOMContentLoaded',
      function () {

        carregarPlaylist();

      }
    );


    /* =====================================================
       CARREGAR PLAYLIST
    ===================================================== */

    function carregarPlaylist() {

      if (
        !URL_API ||
        URL_API.includes('COLE_AQUI')
      ) {

        mostrarErro(
          'URL da API não configurada.'
        );

        atualizarStatus(
          'Configure a URL da API',
          false
        );

        return;
      }


      playlistElement.innerHTML = `
        <div class="loading">
          <span class="spinner"></span>
          Carregando áudios...
        </div>
      `;


      atualizarStatus(
        'Carregando programação...',
        true
      );


      const nomeCallback =
        'receberPlaylist_' +
        Date.now();


      let finalizado = false;


      const script =
        document.createElement('script');


      const url =
        URL_API +
        '?acao=listarPlaylist' +
        '&callback=' +
        encodeURIComponent(nomeCallback) +
        '&_=' +
        Date.now();


      const timeout =
        setTimeout(
          function () {

            if (finalizado) {
              return;
            }

            finalizado = true;

            limparCallback();

            mostrarErro(
              'Tempo limite excedido ao carregar a programação.'
            );

            atualizarStatus(
              'Não foi possível carregar a programação',
              false
            );

          },
          15000
        );


      function limparCallback() {

        clearTimeout(timeout);

        if (
          window[nomeCallback]
        ) {

          delete window[nomeCallback];

        }

        if (
          script.parentNode
        ) {

          script.parentNode.removeChild(
            script
          );

        }
      }


      window[nomeCallback] =
        function (resposta) {

          if (finalizado) {
            return;
          }

          finalizado = true;

          limparCallback();


          if (
            !resposta ||
            resposta.sucesso !== true
          ) {

            mostrarErro(
              resposta &&
              resposta.mensagem
                ? resposta.mensagem
                : 'Não foi possível carregar a playlist.'
            );

            atualizarStatus(
              'Erro ao carregar programação',
              false
            );

            return;
          }


          playlist =
            Array.isArray(
              resposta.playlist
            )
              ? resposta.playlist
              : [];


          if (
            playlist.length === 0
          ) {

            playlistElement.innerHTML = `
              <div class="message">
                Nenhum áudio disponível no momento.
              </div>
            `;

            atualizarStatus(
              'Nenhum áudio disponível',
              false
            );

            return;
          }


          aplicarFiltro();


          atualizarStatus(
            playlist.length +
            ' áudio' +
            (
              playlist.length === 1
                ? ''
                : 's'
            ) +
            ' disponível' +
            (
              playlist.length === 1
                ? ''
                : 'is'
            ),
            true
          );

        };


      script.onerror =
        function () {

          if (finalizado) {
            return;
          }

          finalizado = true;

          limparCallback();


          mostrarErro(
            'Não foi possível conectar à API.'
          );

          atualizarStatus(
            'Erro de conexão',
            false
          );

        };


      script.src = url;

      document.body.appendChild(
        script
      );

    }


    /* =====================================================
       FILTRO
    ===================================================== */

    function filtrar(
      tipo,
      botao
    ) {

      filtroAtual = tipo;


      document
        .querySelectorAll(
          '.filter-btn'
        )
        .forEach(
          function (btn) {

            btn.classList.remove(
              'active'
            );

          }
        );


      if (botao) {

        botao.classList.add(
          'active'
        );

      }


      aplicarFiltro();

    }


    function aplicarFiltro() {

      if (
        filtroAtual === 'todos'
      ) {

        playlistFiltrada =
          playlist.slice();

      } else {

        playlistFiltrada =
          playlist.filter(
            function (item) {

              return normalizarTipo(
                item.tipo
              ) === filtroAtual;

            }
          );

      }


      renderizarPlaylist();

    }


    /* =====================================================
       NORMALIZAR TIPO
    ===================================================== */

    function normalizarTipo(
      tipo
    ) {

      return String(
        tipo || ''
      )
        .toLowerCase()
        .normalize('NFD')
        .replace(
          /[\u0300-\u036f]/g,
          ''
        )
        .trim()
        .replace(
          /\s+/g,
          ' '
        )
        .replace(
          ' ',
          ''
        );

    }


    /* =====================================================
       RENDERIZAR PLAYLIST
    ===================================================== */

    function renderizarPlaylist() {

      if (
        playlistFiltrada.length === 0
      ) {

        playlistElement.innerHTML = `
          <div class="message">
            Nenhum áudio encontrado neste filtro.
          </div>
        `;

        return;
      }


      playlistElement.innerHTML =
        playlistFiltrada
          .map(
            function (
              item,
              index
            ) {

              const tipo =
                normalizarTipo(
                  item.tipo
                );


              const ehOracao =
                tipo === 'oracao';


              const icone =
                ehOracao
                  ? '🙏'
                  : '🎵';


              const ativo =
                indiceAtual === index
                  ? 'active'
                  : '';


              const titulo =
                escaparHtml(
                  item.titulo ||
                  'Áudio sem título'
                );


              const artista =
                escaparHtml(
                  item.artista ||
                  ''
                );


              const tipoTexto =
                escaparHtml(
                  item.tipo ||
                  'Música'
                );


              return `
                <div
                  class="audio-item ${ativo}"
                  onclick="tocar(${index})"
                  title="Clique para ouvir">

                  <div class="audio-icon">
                    ${icone}
                  </div>


                  <div class="audio-info">

                    <div class="audio-title">
                      ${titulo}
                    </div>

                    ${
                      artista
                        ? `
                          <div class="audio-artist">
                            ${artista}
                          </div>
                        `
                        : ''
                    }

                    <div class="audio-type">
                      ${tipoTexto}
                    </div>

                  </div>


                  <div class="play-icon">
                    ▶
                  </div>

                </div>
              `;

            }
          )
          .join('');

    }


    /* =====================================================
       TOCAR ÁUDIO
    ===================================================== */

    function tocar(index) {

      const item =
        playlistFiltrada[index];


      if (!item) {
        return;
      }


      if (
        !item.url
      ) {

        atualizarStatus(
          'Este áudio não possui URL.',
          false
        );

        return;
      }


      indiceAtual = index;


      /* Remove o aviso inicial */

      if (playHint) {

        playHint.style.display =
          'none';

      }


      currentTitle.textContent =
        item.titulo ||
        'Áudio sem título';


      currentArtist.textContent =
        item.artista ||
        '';


      currentType.textContent =
        item.tipo ||
        'Música';


      atualizarStatus(
        'Preparando áudio...',
        true
      );


      player.pause();


      player.src =
        item.url;


      player.load();


      atualizarItemAtivo();


      const tentativa =
        player.play();


      if (
        tentativa &&
        typeof tentativa.catch ===
          'function'
      ) {

        tentativa.catch(
          function () {

            atualizarStatus(
              'Clique em ▶ para iniciar o áudio.',
              true
            );

          }
        );

      }

    }


    /* =====================================================
       ANTERIOR
    ===================================================== */

    function anterior() {

      if (
        playlistFiltrada.length === 0
      ) {
        return;
      }


      let novoIndice;


      if (
        indiceAtual <= 0
      ) {

        novoIndice =
          playlistFiltrada.length - 1;

      } else {

        novoIndice =
          indiceAtual - 1;

      }


      tocar(novoIndice);

    }


    /* =====================================================
       PRÓXIMO
    ===================================================== */

    function proximo() {

      if (
        playlistFiltrada.length === 0
      ) {
        return;
      }


      let novoIndice;


      if (
        indiceAtual < 0 ||
        indiceAtual >=
          playlistFiltrada.length - 1
      ) {

        novoIndice = 0;

      } else {

        novoIndice =
          indiceAtual + 1;

      }


      tocar(novoIndice);

    }


    /* =====================================================
       ÁUDIO TERMINOU
    ===================================================== */

    player.addEventListener(
      'ended',
      function () {

        proximo();

      }
    );


    /* =====================================================
       ÁUDIO PRONTO
    ===================================================== */

    player.addEventListener(
      'canplay',
      function () {

        atualizarStatus(
          'Áudio pronto para reprodução.',
          true
        );

      }
    );


    /* =====================================================
       ÁUDIO TOCANDO
    ===================================================== */

    player.addEventListener(
      'play',
      function () {

        atualizarStatus(
          'Reproduzindo agora',
          true
        );

      }
    );


    /* =====================================================
       ÁUDIO PAUSADO
    ===================================================== */

    player.addEventListener(
      'pause',
      function () {

        if (
          !player.ended
        ) {

          atualizarStatus(
            'Áudio pausado',
            true
          );

        }

      }
    );


    /* =====================================================
       ERRO NO ÁUDIO
    ===================================================== */

    player.addEventListener(
      'error',
      function () {

        atualizarStatus(
          'Não foi possível reproduzir este áudio.',
          false
        );

      }
    );


    /* =====================================================
       ITEM ATIVO
    ===================================================== */

    function atualizarItemAtivo() {

      document
        .querySelectorAll(
          '.audio-item'
        )
        .forEach(
          function (
            item,
            index
          ) {

            item.classList.toggle(
              'active',
              index === indiceAtual
            );

          }
        );

    }


    /* =====================================================
       STATUS
    ===================================================== */

    function atualizarStatus(
      mensagem,
      online
    ) {

      statusText.textContent =
        mensagem;


      if (online) {

        statusDot.style.background =
          '#4ade80';

        statusDot.style.boxShadow =
          '0 0 10px rgba(74,222,128,.7)';

      } else {

        statusDot.style.background =
          '#f87171';

        statusDot.style.boxShadow =
          '0 0 10px rgba(248,113,113,.7)';

      }

    }


    /* =====================================================
       MOSTRAR ERRO
    ===================================================== */

    function mostrarErro(
      mensagem
    ) {

      playlistElement.innerHTML = `
        <div class="message error">
          ${escaparHtml(mensagem)}
        </div>
      `;

    }


    /* =====================================================
       ESCAPAR HTML
    ===================================================== */

    function escaparHtml(
      valor
    ) {

      return String(
        valor ?? ''
      )
        .replace(
          /&/g,
          '&amp;'
        )
        .replace(
          /</g,
          '&lt;'
        )
        .replace(
          />/g,
          '&gt;'
        )
        .replace(
          /"/g,
          '&quot;'
        )
        .replace(
          /'/g,
          '&#039;'
        );

    }

  </script>
