<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Rádio Onda Livre</title>

<style>

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    min-height: 100vh;

    font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    background:
        linear-gradient(
            135deg,
            #071a35,
            #0b2e59,
            #082342
        );

    color: #fff;

    padding: 25px 15px;
}

.container {

    width: 100%;

    max-width: 760px;

    margin: 0 auto;
}

.header {

    text-align: center;

    margin-bottom: 20px;
}

.microphone {

    width: 62px;
    height: 62px;

    margin: 0 auto 12px;

    border-radius: 50%;

    display: flex;

    align-items: center;
    justify-content: center;

    font-size: 30px;

    background:
        rgba(255,255,255,.12);

    border:
        1px solid
        rgba(255,255,255,.15);
}

h1 {

    margin: 0;

    font-size: 28px;

    font-weight: 700;
}

.subtitle {

    margin-top: 6px;

    color:
        rgba(255,255,255,.72);

    font-size: 14px;
}

.player-card {

    background:
        rgba(255,255,255,.10);

    border:
        1px solid
        rgba(255,255,255,.13);

    backdrop-filter:
        blur(16px);

    border-radius: 18px;

    padding: 20px;

    box-shadow:
        0 15px 45px
        rgba(0,0,0,.22);
}

.status {

    display: flex;

    align-items: center;

    gap: 7px;

    font-size: 12px;

    color:
        rgba(255,255,255,.65);

    margin-bottom: 10px;
}

.status-dot {

    width: 8px;
    height: 8px;

    border-radius: 50%;

    background: #5ee68a;
}

.current-type {

    font-size: 11px;

    text-transform: uppercase;

    letter-spacing: .08em;

    color:
        rgba(255,255,255,.55);
}

.current-title {

    font-size: 21px;

    font-weight: 700;

    margin-top: 3px;
}

.current-artist {

    font-size: 13px;

    color:
        rgba(255,255,255,.68);

    margin-top: 2px;

    margin-bottom: 15px;
}

audio {

    width: 100%;
}

.controls {

    display: flex;

    justify-content: center;

    gap: 10px;

    margin-top: 15px;
}

.control-btn {

    border: none;

    width: 43px;
    height: 40px;

    border-radius: 10px;

    background:
        rgba(255,255,255,.12);

    color: white;

    cursor: pointer;

    font-size: 17px;

    transition: .2s ease;
}

.control-btn:hover {

    background:
        rgba(255,255,255,.20);

    transform:
        translateY(-1px);
}

.filters {

    display: flex;

    gap: 8px;

    flex-wrap: wrap;

    margin: 20px 0 12px;
}

.filter-btn {

    border: 1px solid
        rgba(255,255,255,.12);

    background:
        rgba(255,255,255,.07);

    color:
        rgba(255,255,255,.75);

    padding: 8px 14px;

    border-radius: 20px;

    cursor: pointer;

    font-size: 13px;

    transition: .2s ease;
}

.filter-btn:hover {

    background:
        rgba(255,255,255,.12);
}

.filter-btn.active {

    background: #1976d2;

    color: white;

    border-color: #1976d2;
}

.playlist {

    display: flex;

    flex-direction: column;

    gap: 8px;
}

.audio-item {

    display: flex;

    align-items: center;

    gap: 12px;

    padding: 12px 14px;

    border-radius: 13px;

    background:
        rgba(255,255,255,.07);

    border:
        1px solid
        rgba(255,255,255,.08);

    cursor: pointer;

    transition: .2s ease;
}

.audio-item:hover {

    background:
        rgba(255,255,255,.12);

    transform:
        translateY(-1px);
}

.audio-item.active {

    background:
        rgba(25,118,210,.27);

    border-color:
        rgba(65,155,235,.45);
}

.audio-icon {

    width: 38px;
    height: 38px;

    flex-shrink: 0;

    display: flex;

    align-items: center;
    justify-content: center;

    border-radius: 10px;

    background:
        rgba(255,255,255,.09);

    font-size: 17px;
}

.audio-info {

    min-width: 0;

    flex: 1;
}

.audio-title {

    font-size: 14px;

    font-weight: 600;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
}

.audio-artist {

    font-size: 12px;

    color:
        rgba(255,255,255,.58);

    margin-top: 2px;
}

.audio-type {

    font-size: 10px;

    color:
        rgba(255,255,255,.48);

    margin-top: 4px;
}

/* =========================================================
   BOTÃO COMPARTILHAR
   ========================================================= */

.share-btn {

    flex-shrink: 0;

    width: 38px;
    height: 38px;

    border: 1px solid
        rgba(255,255,255,.12);

    border-radius: 10px;

    background:
        rgba(255,255,255,.08);

    color: white;

    cursor: pointer;

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 16px;

    transition: .2s ease;
}

.share-btn:hover {

    background:
        rgba(25,118,210,.35);

    transform:
        translateY(-1px);
}

.share-btn:active {

    transform:
        scale(.94);
}

.play-hint {

    text-align: center;

    padding: 16px;

    color:
        rgba(255,255,255,.60);

    font-size: 13px;
}

.message {

    text-align: center;

    padding: 25px;

    color:
        rgba(255,255,255,.65);

    font-size: 14px;
}

footer {

    text-align: center;

    margin-top: 25px;

    font-size: 11px;

    color:
        rgba(255,255,255,.42);
}

@media(max-width:600px) {

    body {

        padding: 18px 10px;
    }

    h1 {

        font-size: 24px;
    }

    .player-card {

        padding: 16px;
    }

    .current-title {

        font-size: 19px;
    }

    .filter-btn {

        padding: 7px 12px;
    }

    .audio-item {

        padding: 11px 10px;

        gap: 9px;
    }

    .audio-title {

        font-size: 13px;
    }

    .share-btn {

        width: 36px;
        height: 36px;
    }
}

</style>

</head>


<body>


<div class="container">


<header class="header">

    <div class="microphone">
        🎙️
    </div>

    <h1>
        Rádio Onda Livre
    </h1>

    <div class="subtitle">
        Música, oração e mensagens para o seu dia
    </div>

</header>


<section class="player-card">


    <div class="status">

        <span
            class="status-dot"
            id="statusDot"
        ></span>

        <span id="statusText">
            Conectando...
        </span>

    </div>


    <div
        class="current-type"
        id="currentType"
    >
        ÁUDIO
    </div>


    <div
        class="current-title"
        id="currentTitle"
    >
        Rádio Onda Livre
    </div>


    <div
        class="current-artist"
        id="currentArtist"
    >
        Carregando primeiro áudio...
    </div>


    <audio
        id="audioPlayer"
        controls
        preload="auto"
    ></audio>


    <div class="controls">

        <button
            class="control-btn"
            onclick="anterior()"
            title="Anterior"
            aria-label="Áudio anterior"
        >
            ⏮
        </button>


        <button
            class="control-btn"
            onclick="proximo()"
            title="Próximo"
            aria-label="Próximo áudio"
        >
            ⏭
        </button>

    </div>


</section>


<div class="filters">


    <button
        class="filter-btn active"
        onclick="filtrar('Todos', this)"
    >
        Todos
    </button>


    <button
        class="filter-btn"
        onclick="filtrar('Música', this)"
    >
        🎵 Músicas
    </button>


    <button
        class="filter-btn"
        onclick="filtrar('Oração', this)"
    >
        🙏 Orações
    </button>


    <button
        class="filter-btn"
        onclick="filtrar('Mensagem', this)"
    >
        💬 Mensagens
    </button>


</div>


<div
    id="playHint"
    class="play-hint"
>

    <strong>
        Carregando o primeiro áudio...
    </strong>

    <br>

    ▶ A reprodução automática será iniciada quando possível

</div>


<div
    id="playlist"
    class="playlist"
></div>


<footer>

    Rádio Onda Livre • Joel Rodrigues

</footer>


</div>



<script>


/* =========================================================
   CONFIGURAÇÃO
   ========================================================= */

const URL_API =
    'https://script.google.com/macros/s/AKfycby4tIS3B07OIcPVoCgKde_EL6PHkRXp46nMMNVh0yYxoYlpcSQeXbBqjLQ6vvVfnJcX4Q/exec';



/* =========================================================
   VARIÁVEIS
   ========================================================= */

let playlist = [];

let playlistFiltrada = [];

let indiceAtual = -1;

let filtroAtual = 'Todos';

let ultimoEventoPlay = '';

let heartbeatTimer = null;

let acessoRegistrado = false;



/* =========================================================
   LOCALIZAÇÃO
   ========================================================= */

let localizacaoVisitante = {

    cidade: '',

    estado: ''
};



/* =========================================================
   SESSÃO
   ========================================================= */

function obterSessao() {

    const chave =
        'radio_onda_livre_sessao';


    let sessao =
        sessionStorage.getItem(
            chave
        );


    if (!sessao) {

        sessao =
            gerarId();


        sessionStorage.setItem(
            chave,
            sessao
        );
    }


    return sessao;
}



/* =========================================================
   GERAR ID DA SESSÃO
   ========================================================= */

function gerarId() {

    return (
        Date.now().toString(36) +
        '_' +
        Math.random()
            .toString(36)
            .substring(2, 14)
    );
}



/* =========================================================
   LOCALIZAÇÃO SALVA
   ========================================================= */

function obterLocalizacaoSalva() {

    try {

        const texto =
            localStorage.getItem(
                'radio_onda_livre_localizacao'
            );


        if (!texto) {

            return false;
        }


        const dados =
            JSON.parse(
                texto
            );


        if (
            dados &&
            dados.cidade
        ) {

            localizacaoVisitante = {

                cidade:
                    String(
                        dados.cidade ||
                        ''
                    ).trim(),

                estado:
                    String(
                        dados.estado ||
                        ''
                    ).trim()
            };


            return true;
        }

    } catch (erro) {

        console.warn(
            'Erro ao ler localização salva:',
            erro
        );
    }


    return false;
}



/* =========================================================
   SALVAR LOCALIZAÇÃO
   ========================================================= */

function salvarLocalizacao() {

    try {

        localStorage.setItem(

            'radio_onda_livre_localizacao',

            JSON.stringify(
                localizacaoVisitante
            )
        );

    } catch (erro) {

        console.warn(
            'Não foi possível salvar localização:',
            erro
        );
    }
}



/* =========================================================
   CONSULTAR LOCALIZAÇÃO POR IP
   ========================================================= */

function consultarLocalizacaoIP() {

    return new Promise(
        function(resolve) {

            let concluido = false;


            const callback =
                'localizacao_' +
                Date.now() +
                '_' +
                Math.floor(
                    Math.random() * 100000
                );


            const script =
                document.createElement(
                    'script'
                );


            const timer =
                setTimeout(
                    function() {

                        if (concluido) {

                            return;
                        }


                        concluido = true;


                        limpar();


                        console.warn(
                            'Tempo esgotado ao obter localização.'
                        );


                        resolve(false);

                    },
                    7000
                );



            function limpar() {

                clearTimeout(
                    timer
                );


                try {

                    delete window[
                        callback
                    ];

                } catch(e) {}


                if (
                    script &&
                    script.parentNode
                ) {

                    script.parentNode
                        .removeChild(
                            script
                        );
                }
            }



            window[callback] =
                function(dados) {

                    if (concluido) {

                        return;
                    }


                    concluido = true;


                    limpar();


                    if (
                        !dados ||
                        dados.error
                    ) {

                        console.warn(
                            'IP API não retornou localização:',
                            dados
                        );


                        resolve(false);

                        return;
                    }


                    const cidade =
                        String(
                            dados.city ||
                            ''
                        ).trim();


                    const estado =
                        String(
                            dados.region_code ||
                            dados.region ||
                            ''
                        ).trim();


                    if (!cidade) {

                        resolve(false);

                        return;
                    }


                    localizacaoVisitante = {

                        cidade:
                            cidade,

                        estado:
                            estado
                    };


                    salvarLocalizacao();


                    console.log(
                        'LOCALIZAÇÃO OBTIDA:',
                        localizacaoVisitante
                    );


                    resolve(true);
                };



            script.onerror =
                function() {

                    if (concluido) {

                        return;
                    }


                    concluido = true;


                    limpar();


                    console.warn(
                        'Falha na API de localização.'
                    );


                    resolve(false);
                };



            script.src =
                'https://ipapi.co/jsonp/?callback=' +
                encodeURIComponent(
                    callback
                ) +
                '&_=' +
                Date.now();


            document.body.appendChild(
                script
            );

        }
    );
}



/* =========================================================
   OBTER LOCALIZAÇÃO
   ========================================================= */

async function obterLocalizacao() {

    if (
        obterLocalizacaoSalva()
    ) {

        console.log(
            'Localização recuperada:',
            localizacaoVisitante
        );


        return true;
    }


    atualizarStatus(
        'Identificando localização...'
    );


    for (
        let tentativa = 1;
        tentativa <= 2;
        tentativa++
    ) {

        const sucesso =
            await consultarLocalizacaoIP();


        if (sucesso) {

            return true;
        }


        if (
            tentativa === 1
        ) {

            await new Promise(
                function(resolve) {

                    setTimeout(
                        resolve,
                        800
                    );
                }
            );
        }
    }


    console.warn(
        'Não foi possível identificar a localização.'
    );


    return false;
}



/* =========================================================
   REGISTRAR EVENTO
   ========================================================= */

function registrarEvento(
    evento,
    audioId = '',
    titulo = ''
) {

    if (!URL_API) {

        return;
    }


    const callback =
        'evento_' +
        Date.now() +
        '_' +
        Math.floor(
            Math.random() * 100000
        );


    let script = null;


    window[callback] =
        function(resposta) {

            try {

                delete window[
                    callback
                ];

            } catch(e) {}


            if (
                script &&
                script.parentNode
            ) {

                script.parentNode
                    .removeChild(
                        script
                    );
            }


            if (
                resposta &&
                resposta.cidade
            ) {

                localizacaoVisitante.cidade =
                    resposta.cidade;


                localizacaoVisitante.estado =
                    resposta.estado || '';


                salvarLocalizacao();
            }
        };


    const parametros =
        new URLSearchParams({

            acao:
                'registrarEvento',

            evento:
                evento || '',

            audioId:
                audioId || '',

            titulo:
                titulo || '',

            sessao:
                obterSessao(),

            cidade:
                localizacaoVisitante.cidade,

            estado:
                localizacaoVisitante.estado,

            callback:
                callback,

            _:
                Date.now()
        });


    script =
        document.createElement(
            'script'
        );


    script.src =
        URL_API +
        '?' +
        parametros.toString();


    script.onerror =
        function() {

            try {

                delete window[
                    callback
                ];

            } catch(e) {}


            if (
                script &&
                script.parentNode
            ) {

                script.parentNode
                    .removeChild(
                        script
                    );
            }
        };


    document.body.appendChild(
        script
    );
}



/* =========================================================
   VERIFICAR ACESSO ANTERIOR
   ========================================================= */

function verificarAcessoAnterior() {

    return (
        sessionStorage.getItem(
            'radio_onda_livre_acesso_registrado'
        ) === '1'
    );
}



/* =========================================================
   REGISTRAR ACESSO
   ========================================================= */

async function registrarAcesso() {

    if (
        acessoRegistrado
    ) {

        return;
    }


    await obterLocalizacao();


    console.log(
        'REGISTRANDO ACESSO:',
        {

            sessao:
                obterSessao(),

            cidade:
                localizacaoVisitante.cidade,

            estado:
                localizacaoVisitante.estado
        }
    );


    registrarEvento(
        'ACESSO'
    );


    acessoRegistrado =
        true;


    sessionStorage.setItem(
        'radio_onda_livre_acesso_registrado',
        '1'
    );
}



/* =========================================================
   CARREGAR PLAYLIST
   ========================================================= */

function carregarPlaylist() {

    atualizarStatus(
        'Carregando playlist...'
    );


    const callback =
        'playlist_' +
        Date.now() +
        '_' +
        Math.floor(
            Math.random() * 10000
        );


    let concluido = false;


    const script =
        document.createElement(
            'script'
        );


    const timer =
        setTimeout(
            function() {

                if (concluido) {

                    return;
                }


                concluido = true;


                try {

                    delete window[
                        callback
                    ];

                } catch(e) {}


                script.remove();


                mostrarMensagem(
                    'Não foi possível carregar a playlist.'
                );

            },
            15000
        );



    window[callback] =
        function(resposta) {

            if (concluido) {

                return;
            }


            concluido = true;


            clearTimeout(
                timer
            );


            try {

                delete window[
                    callback
                ];

            } catch(e) {}


            script.remove();


            if (
                !resposta ||
                !resposta.sucesso
            ) {

                mostrarMensagem(

                    resposta &&
                    resposta.mensagem
                        ? resposta.mensagem
                        : 'Erro ao carregar playlist.'
                );


                atualizarStatus(
                    'Erro'
                );


                return;
            }


            playlist =
                Array.isArray(
                    resposta.playlist
                )
                    ? resposta.playlist
                    : [];


            aplicarFiltro();


            atualizarStatus(
                'Pronto'
            );


            /*
             * =================================================
             * INICIA O PRIMEIRO ÁUDIO
             * =================================================
             */

            if (
                playlist.length > 0
            ) {

                setTimeout(
                    function() {

                        tocarPrimeiroAudio();

                    },
                    500
                );

            } else {

                atualizarStatus(
                    'Playlist vazia'
                );
            }
        };



    script.onerror =
        function() {

            if (concluido) {

                return;
            }


            concluido = true;


            clearTimeout(
                timer
            );


            try {

                delete window[
                    callback
                ];

            } catch(e) {}


            script.remove();


            mostrarMensagem(
                'Erro de comunicação com o servidor.'
            );


            atualizarStatus(
                'Erro de comunicação'
            );
        };



    script.src =
        URL_API +
        '?acao=listarPlaylist' +
        '&callback=' +
        encodeURIComponent(
            callback
        ) +
        '&_=' +
        Date.now();


    document.body.appendChild(
        script
    );
}



/* =========================================================
   FILTRO
   ========================================================= */

function filtrar(
    tipo,
    botao
) {

    filtroAtual =
        tipo;


    document
        .querySelectorAll(
            '.filter-btn'
        )
        .forEach(
            function(btn) {

                btn.classList.remove(
                    'active'
                );
            }
        );


    if (botao) {

        botao.classList.add(
            'active'
        );
    }


    aplicarFiltro();
}



/* =========================================================
   NORMALIZAR TIPO
   ========================================================= */

function normalizarTipo(
    tipo
) {

    return String(
        tipo || ''
    )
        .toLowerCase()
        .normalize('NFD')
        .replace(
            /[\u0300-\u036f]/g,
            ''
        )
        .trim();
}



/* =========================================================
   APLICAR FILTRO
   ========================================================= */

function aplicarFiltro() {

    if (
        filtroAtual === 'Todos'
    ) {

        playlistFiltrada =
            playlist.slice();

    } else {

        const filtro =
            normalizarTipo(
                filtroAtual
            );


        playlistFiltrada =
            playlist.filter(
                function(item) {

                    return (
                        normalizarTipo(
                            item.tipo
                        ) === filtro
                    );
                }
            );
    }


    renderizarPlaylist();
}



/* =========================================================
   COMPARTILHAR ÁUDIO
   ========================================================= */

async function compartilharAudio(index) {

    if (
        index < 0 ||
        index >= playlist.length
    ) {

        return;
    }


    const item =
        playlist[index];


    if (!item) {

        return;
    }


    const titulo =
        item.titulo ||
        'Áudio da Rádio Onda Livre';


    const url =
        item.url ||
        window.location.href;


    const texto =
        '🎧 ' +
        titulo +
        '\n\nOuça na Rádio Onda Livre';


    if (
        navigator.share
    ) {

        try {

            await navigator.share({

                title:
                    titulo,

                text:
                    texto,

                url:
                    url
            });


            registrarEvento(
                'COMPARTILHAR',
                item.id,
                titulo
            );


            return;

        } catch (erro) {

            if (
                erro &&
                erro.name ===
                'AbortError'
            ) {

                return;
            }


            console.warn(
                'Erro no compartilhamento:',
                erro
            );
        }
    }


    try {

        await navigator.clipboard.writeText(
            url
        );


        registrarEvento(
            'COMPARTILHAR',
            item.id,
            titulo
        );


        alert(
            'Link do áudio copiado!\n\n' +
            'Agora você pode colar e enviar pelo WhatsApp ou outra rede.'
        );

    } catch (erro) {

        const campo =
            document.createElement(
                'textarea'
            );


        campo.value =
            url;


        campo.style.position =
            'fixed';

        campo.style.left =
            '-9999px';


        document.body.appendChild(
            campo
        );


        campo.select();


        try {

            document.execCommand(
                'copy'
            );


            registrarEvento(
                'COMPARTILHAR',
                item.id,
                titulo
            );


            alert(
                'Link do áudio copiado!'
            );

        } catch (erroCopia) {

            alert(
                'Não foi possível copiar o link.\n\n' +
                url
            );

        } finally {

            document.body.removeChild(
                campo
            );
        }
    }
}



/* =========================================================
   RENDERIZAR PLAYLIST
   ========================================================= */

function renderizarPlaylist() {

    const container =
        document.getElementById(
            'playlist'
        );


    if (
        !playlistFiltrada.length
    ) {

        container.innerHTML =
            '<div class="message">' +
            'Nenhum áudio encontrado.' +
            '</div>';


        return;
    }


    container.innerHTML =
        playlistFiltrada
            .map(
                function(item) {

                    const originalIndex =
                        playlist.indexOf(
                            item
                        );


                    const tipo =
                        normalizarTipo(
                            item.tipo
                        );


                    let icone =
                        '🎵';


                    if (
                        tipo === 'oracao'
                    ) {

                        icone =
                            '🙏';
                    }


                    if (
                        tipo === 'mensagem'
                    ) {

                        icone =
                            '💬';
                    }


                    const ativo =
                        originalIndex ===
                        indiceAtual
                            ? 'active'
                            : '';


                    return `

                    <div
                        class="audio-item ${ativo}"
                        onclick="tocar(${originalIndex})"
                    >

                        <div class="audio-icon">
                            ${icone}
                        </div>


                        <div class="audio-info">

                            <div class="audio-title">
                                ${escaparHtml(
                                    item.titulo
                                )}
                            </div>

                            <div class="audio-artist">
                                ${escaparHtml(
                                    item.artista || ''
                                )}
                            </div>

                            <div class="audio-type">
                                ${escaparHtml(
                                    item.tipo || ''
                                )}
                            </div>

                        </div>


                        <button
                            type="button"
                            class="share-btn"
                            title="Compartilhar áudio"
                            aria-label="Compartilhar ${escaparHtml(
                                item.titulo || 'áudio'
                            )}"
                            onclick="event.stopPropagation(); compartilharAudio(${originalIndex})"
                        >
                            🔗
                        </button>

                    </div>

                    `;
                }
            )
            .join('');
}



/* =========================================================
   TOCAR PRIMEIRO ÁUDIO
   ========================================================= */

function tocarPrimeiroAudio() {

    if (
        !playlist ||
        !playlist.length
    ) {

        return;
    }


    /*
     * Não substitui uma música
     * que já esteja tocando.
     */

    if (
        indiceAtual >= 0
    ) {

        return;
    }


    indiceAtual =
        0;


    const item =
        playlist[0];


    const player =
        document.getElementById(
            'audioPlayer'
        );


    /*
     * Atualiza informações.
     */

    document.getElementById(
        'currentTitle'
    ).textContent =
        item.titulo ||
        'Áudio sem título';


    document.getElementById(
        'currentArtist'
    ).textContent =
        item.artista || '';


    document.getElementById(
        'currentType'
    ).textContent =
        item.tipo ||
        'ÁUDIO';


    /*
     * Esconde mensagem inicial.
     */

    const hint =
        document.getElementById(
            'playHint'
        );


    if (hint) {

        hint.style.display =
            'none';
    }


    /*
     * Define o áudio.
     */

    player.src =
        item.url;


    player.load();


    /*
     * Destaca a primeira música.
     */

    atualizarItemAtivo();


    atualizarStatus(
        'Iniciando primeiro áudio...'
    );


    /*
     * Tenta iniciar automaticamente.
     */

    const tentativa =
        player.play();


    if (
        tentativa !== undefined
    ) {

        tentativa
            .then(
                function() {

                    atualizarStatus(
                        'Reproduzindo'
                    );

                }
            )
            .catch(
                function(erro) {

                    console.log(
                        'Autoplay bloqueado pelo navegador:',
                        erro
                    );


                    atualizarStatus(
                        'Clique no ▶ para iniciar'
                    );


                    /*
                     * Mantém o primeiro áudio
                     * carregado no player.
                     */

                    player.controls = true;
                }
            );
    }
}



/* =========================================================
   TOCAR ÁUDIO
   ========================================================= */

function tocar(index) {

    if (
        index < 0 ||
        index >= playlist.length
    ) {

        return;
    }


    const item =
        playlist[index];


    indiceAtual =
        index;


    const player =
        document.getElementById(
            'audioPlayer'
        );


    document.getElementById(
        'currentTitle'
    ).textContent =
        item.titulo ||
        'Áudio sem título';


    document.getElementById(
        'currentArtist'
    ).textContent =
        item.artista || '';


    document.getElementById(
        'currentType'
    ).textContent =
        item.tipo ||
        'ÁUDIO';


    const hint =
        document.getElementById(
            'playHint'
        );


    if (hint) {

        hint.style.display =
            'none';
    }


    player.pause();


    ultimoEventoPlay =
        '';


    player.src =
        item.url;


    player.load();


    atualizarStatus(
        'Carregando áudio...'
    );


    const tentativa =
        player.play();


    if (
        tentativa !== undefined
    ) {

        tentativa
            .then(
                function() {

                    atualizarStatus(
                        'Reproduzindo'
                    );

                }
            )
            .catch(
                function() {

                    atualizarStatus(
                        'Clique no ▶ para iniciar'
                    );
                }
            );
    }


    atualizarItemAtivo();
}



/* =========================================================
   REGISTRAR PLAY
   ========================================================= */

function registrarPlayAtual() {

    if (
        indiceAtual < 0 ||
        !playlist[indiceAtual]
    ) {

        return;
    }


    const item =
        playlist[
            indiceAtual
        ];


    const chave =
        String(
            item.id
        );


    if (
        ultimoEventoPlay ===
        chave
    ) {

        return;
    }


    ultimoEventoPlay =
        chave;


    registrarEvento(
        'PLAY',
        item.id,
        item.titulo
    );


    iniciarHeartbeat();
}



/* =========================================================
   HEARTBEAT
   ========================================================= */

function iniciarHeartbeat() {

    pararHeartbeat();


    heartbeatTimer =
        setInterval(
            function() {

                const player =
                    document.getElementById(
                        'audioPlayer'
                    );


                if (
                    !player.paused &&
                    indiceAtual >= 0 &&
                    playlist[indiceAtual]
                ) {

                    const item =
                        playlist[
                            indiceAtual
                        ];


                    registrarEvento(
                        'HEARTBEAT',
                        item.id,
                        item.titulo
                    );
                }

            },
            60000
        );
}



function pararHeartbeat() {

    if (
        heartbeatTimer
    ) {

        clearInterval(
            heartbeatTimer
        );


        heartbeatTimer =
            null;
    }
}



/* =========================================================
   ANTERIOR
   ========================================================= */

function anterior() {

    if (
        !playlist.length
    ) {

        return;
    }


    let novoIndice =
        indiceAtual - 1;


    if (
        novoIndice < 0
    ) {

        novoIndice =
            playlist.length - 1;
    }


    tocar(
        novoIndice
    );
}



/* =========================================================
   PRÓXIMO
   ========================================================= */

function proximo() {

    if (
        !playlist.length
    ) {

        return;
    }


    let novoIndice =
        indiceAtual + 1;


    if (
        novoIndice >=
        playlist.length
    ) {

        novoIndice =
            0;
    }


    tocar(
        novoIndice
    );
}



/* =========================================================
   ATUALIZAR ITEM ATIVO
   ========================================================= */

function atualizarItemAtivo() {

    renderizarPlaylist();
}



/* =========================================================
   STATUS
   ========================================================= */

function atualizarStatus(
    texto
) {

    const elemento =
        document.getElementById(
            'statusText'
        );


    if (elemento) {

        elemento.textContent =
            texto;
    }
}



/* =========================================================
   MENSAGEM
   ========================================================= */

function mostrarMensagem(
    mensagem
) {

    document.getElementById(
        'playlist'
    ).innerHTML =

        '<div class="message">' +
        escaparHtml(
            mensagem
        ) +
        '</div>';
}



/* =========================================================
   ESCAPAR HTML
   ========================================================= */

function escaparHtml(
    texto
) {

    return String(
        texto || ''
    )
        .replace(
            /&/g,
            '&amp;'
        )
        .replace(
            /</g,
            '&lt;'
        )
        .replace(
            />/g,
            '&gt;'
        )
        .replace(
            /"/g,
            '&quot;'
        )
        .replace(
            /'/g,
            '&#039;'
        );
}



/* =========================================================
   EVENTOS DO PLAYER
   ========================================================= */

const player =
    document.getElementById(
        'audioPlayer'
    );


/*
 * PLAY
 */

player.addEventListener(
    'play',
    function() {

        atualizarStatus(
            'Reproduzindo'
        );


        registrarPlayAtual();
    }
);


/*
 * PAUSE
 */

player.addEventListener(
    'pause',
    function() {

        /*
         * Não altera para "Pausado"
         * se o áudio ainda não chegou
         * a iniciar.
         */

        if (
            player.currentTime > 0 &&
            !player.ended
        ) {

            atualizarStatus(
                'Pausado'
            );
        }


        pararHeartbeat();


        if (
            indiceAtual >= 0 &&
            playlist[indiceAtual]
        ) {

            const item =
                playlist[
                    indiceAtual
                ];


            registrarEvento(
                'PAUSE',
                item.id,
                item.titulo
            );
        }
    }
);


/*
 * FIM
 */

player.addEventListener(
    'ended',
    function() {

        atualizarStatus(
            'Próximo áudio'
        );


        pararHeartbeat();


        if (
            indiceAtual >= 0 &&
            playlist[indiceAtual]
        ) {

            const item =
                playlist[
                    indiceAtual
                ];


            registrarEvento(
                'FIM',
                item.id,
                item.titulo
            );
        }


        proximo();
    }
);


/*
 * ÁUDIO PRONTO
 */

player.addEventListener(
    'canplay',
    function() {

        /*
         * Só informa "Áudio pronto"
         * quando ainda não estiver
         * reproduzindo.
         */

        if (
            player.paused
        ) {

            atualizarStatus(
                'Áudio pronto'
            );
        }
    }
);


/*
 * ERRO
 */

player.addEventListener(
    'error',
    function() {

        atualizarStatus(
            'Não foi possível reproduzir'
        );


        pararHeartbeat();
    }
);



/* =========================================================
   INICIALIZAÇÃO
   ========================================================= */

document.addEventListener(
    'DOMContentLoaded',
    async function() {

        /*
         * Verifica se o acesso já foi
         * registrado nesta sessão da aba.
         */

        if (
            verificarAcessoAnterior()
        ) {

            acessoRegistrado =
                true;


            console.log(
                'Acesso já registrado nesta sessão.'
            );

        } else {

            /*
             * PRIMEIRO:
             * identificar localização.
             */

            await obterLocalizacao();


            /*
             * SEGUNDO:
             * registrar ACESSO.
             */

            await registrarAcesso();
        }


        /*
         * TERCEIRO:
         * carregar playlist.
         *
         * Ao terminar o carregamento,
         * tocarPrimeiroAudio() será
         * executado automaticamente.
         */

        carregarPlaylist();

    }
);

</script>
