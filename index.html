<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Rádio Onda Livre</title>


<style>

* {
  box-sizing: border-box;
}


body {

  margin: 0;

  font-family:
    Inter,
    Arial,
    Helvetica,
    sans-serif;

  background:
    linear-gradient(
      135deg,
      #07111f,
      #0d1b2e 55%,
      #102840
    );

  color: #ffffff;

  min-height: 100vh;
}


.container {

  width: min(1100px, 94%);

  margin: auto;

  padding: 30px 0 50px;
}


/* =========================================================
   CABEÇALHO
   ========================================================= */

header {

  text-align: center;

  padding: 20px 10px 30px;
}


.logo {

  width: 72px;

  height: 72px;

  margin: auto;

  border-radius: 50%;

  display: flex;

  align-items: center;

  justify-content: center;

  font-size: 30px;

  background: rgba(255,255,255,.1);

  border: 1px solid rgba(255,255,255,.15);

  box-shadow:
    0 10px 35px rgba(0,0,0,.25);
}


header h1 {

  margin: 15px 0 5px;

  font-size: clamp(28px, 5vw, 42px);

  font-weight: 700;
}


header p {

  margin: 0;

  color: #b8c7d9;

  font-size: 15px;
}


/* =========================================================
   PLAYER
   ========================================================= */

.player {

  background: rgba(255,255,255,.08);

  border: 1px solid rgba(255,255,255,.12);

  border-radius: 22px;

  padding: 25px;

  box-shadow:
    0 20px 60px rgba(0,0,0,.25);

  backdrop-filter: blur(12px);

  margin-bottom: 25px;
}


.status {

  display: flex;

  align-items: center;

  gap: 9px;

  color: #9fb0c5;

  font-size: 13px;

  margin-bottom: 18px;
}


.status-dot {

  width: 9px;

  height: 9px;

  border-radius: 50%;

  background: #43d17a;

  box-shadow:
    0 0 12px #43d17a;
}


.current {

  text-align: center;

  padding: 10px 0 22px;
}


.current-type {

  display: inline-block;

  padding: 5px 12px;

  border-radius: 30px;

  font-size: 11px;

  text-transform: uppercase;

  letter-spacing: .8px;

  background: rgba(255,255,255,.1);

  color: #b9c8d9;

  margin-bottom: 12px;
}


.current-title {

  font-size: clamp(21px, 4vw, 30px);

  font-weight: 700;

  margin-bottom: 5px;
}


.current-artist {

  color: #9fb0c5;

  font-size: 14px;
}


audio {

  width: 100%;

  margin-top: 12px;
}


/* =========================================================
   CONTROLES
   ========================================================= */

.controls {

  display: flex;

  justify-content: center;

  gap: 10px;

  margin-top: 18px;
}


.btn {

  border: 0;

  cursor: pointer;

  border-radius: 12px;

  padding: 11px 20px;

  font-size: 14px;

  font-weight: 600;

  transition:
    .2s ease;
}


.btn:hover {

  transform: translateY(-1px);
}


.btn-primary {

  background: #1d8cff;

  color: white;
}


.btn-secondary {

  background: rgba(255,255,255,.1);

  color: white;
}


.btn:disabled {

  opacity: .4;

  cursor: not-allowed;

  transform: none;
}


/* =========================================================
   FILTROS
   ========================================================= */

.filters {

  display: flex;

  gap: 10px;

  flex-wrap: wrap;

  margin-bottom: 18px;
}


.filter {

  padding: 10px 17px;

  border-radius: 30px;

  border: 1px solid rgba(255,255,255,.12);

  background: rgba(255,255,255,.06);

  color: #c8d4e2;

  cursor: pointer;

  font-size: 13px;
}


.filter.active {

  background: #1d8cff;

  border-color: #1d8cff;

  color: white;
}


/* =========================================================
   LISTA
   ========================================================= */

.playlist {

  display: grid;

  gap: 10px;
}


.audio-item {

  display: flex;

  align-items: center;

  gap: 15px;

  padding: 15px;

  border-radius: 15px;

  background: rgba(255,255,255,.06);

  border: 1px solid rgba(255,255,255,.08);

  cursor: pointer;

  transition:
    .2s ease;
}


.audio-item:hover {

  background: rgba(255,255,255,.1);

  transform: translateX(2px);
}


.audio-item.active {

  border-color: rgba(29,140,255,.7);

  background: rgba(29,140,255,.12);
}


.number {

  min-width: 32px;

  height: 32px;

  border-radius: 10px;

  display: flex;

  justify-content: center;

  align-items: center;

  background: rgba(255,255,255,.08);

  color: #9fb0c5;

  font-size: 12px;
}


.audio-info {

  flex: 1;

  min-width: 0;
}


.audio-title {

  font-weight: 600;

  font-size: 15px;

  white-space: nowrap;

  overflow: hidden;

  text-overflow: ellipsis;
}


.audio-artist {

  margin-top: 3px;

  color: #8fa1b5;

  font-size: 12px;

  white-space: nowrap;

  overflow: hidden;

  text-overflow: ellipsis;
}


.audio-type {

  padding: 5px 9px;

  border-radius: 20px;

  background: rgba(255,255,255,.08);

  color: #aebed0;

  font-size: 10px;

  white-space: nowrap;
}


/* =========================================================
   MENSAGEM
   ========================================================= */

.message {

  text-align: center;

  padding: 35px 15px;

  color: #aebed0;

  font-size: 14px;
}


.error {

  color: #ff9b9b;
}


/* =========================================================
   RODAPÉ
   ========================================================= */

footer {

  text-align: center;

  padding-top: 35px;

  color: #73869c;

  font-size: 12px;
}


/* =========================================================
   RESPONSIVO
   ========================================================= */

@media (max-width: 600px) {

  .container {

    width: 92%;

    padding-top: 15px;
  }


  .player {

    padding: 18px;

    border-radius: 18px;
  }


  .audio-item {

    padding: 12px;

    gap: 10px;
  }


  .audio-type {

    display: none;
  }


  .controls {

    gap: 7px;
  }


  .btn {

    padding: 10px 15px;
  }

}

</style>

</head>


<body>


<div class="container">


<header>

  <div class="logo">
    🎙️
  </div>

  <h1>Rádio Onda Livre</h1>

  <p>Música, oração e mensagens para o seu dia</p>

</header>



<section class="player">


  <div class="status">

    <span class="status-dot"></span>

    <span id="status">
      Carregando playlist...
    </span>

  </div>



  <div class="current">

    <div
      id="currentType"
      class="current-type"
    >
      Aguardando
    </div>


    <div
      id="currentTitle"
      class="current-title"
    >
      Nenhum áudio selecionado
    </div>


    <div
      id="currentArtist"
      class="current-artist"
    >
      —
    </div>

  </div>



  <audio
  id="audioPlayer"
  controls
  preload="metadata"
  crossorigin="anonymous"
></audio>



  <div class="controls">

    <button
      id="btnAnterior"
      class="btn btn-secondary"
      onclick="anterior()"
    >
      ⏮ Anterior
    </button>


    <button
      id="btnProximo"
      class="btn btn-primary"
      onclick="proximo()"
    >
      Próximo ⏭
    </button>

  </div>

</section>



<div class="filters">

  <button
    class="filter active"
    data-tipo="todos"
    onclick="filtrar('todos', this)"
  >
    Todos
  </button>


  <button
    class="filter"
    data-tipo="musica"
    onclick="filtrar('musica', this)"
  >
    🎵 Músicas
  </button>


  <button
    class="filter"
    data-tipo="oracao"
    onclick="filtrar('oracao', this)"
  >
    🙏 Orações
  </button>

</div>



<section id="playlist" class="playlist">

  <div class="message">
    Carregando...
  </div>

</section>



<footer>

  Rádio Onda Livre

</footer>


</div>



<script>

/* =========================================================
   VARIÁVEIS
   ========================================================= */

let playlist = [];

let playlistFiltrada = [];

let indiceAtual = -1;

let filtroAtual = 'todos';


const player =
  document.getElementById('audioPlayer');
player.addEventListener('error', function() {

  console.error(
    'Erro ao reproduzir:',
    player.src,
    player.error
  );

  status.textContent =
    'Não foi possível reproduzir este áudio.';
});


player.addEventListener('canplay', function() {

  status.textContent =
    'Áudio pronto para reprodução.';

});
const lista =
  document.getElementById('playlist');

const status =
  document.getElementById('status');

const currentTitle =
  document.getElementById('currentTitle');

const currentArtist =
  document.getElementById('currentArtist');

const currentType =
  document.getElementById('currentType');

const btnAnterior =
  document.getElementById('btnAnterior');

const btnProximo =
  document.getElementById('btnProximo');


/* =========================================================
   INICIALIZAÇÃO
   ========================================================= */

document.addEventListener(
  'DOMContentLoaded',
  carregarPlaylist
);


/* =========================================================
   CARREGA PLAYLIST
   ========================================================= */

function carregarPlaylist() {

  status.textContent =
    'Carregando playlist...';


  google.script.run

    .withSuccessHandler(function(resposta) {

      if (!resposta || !resposta.sucesso) {

        mostrarErro(
          resposta && resposta.mensagem
            ? resposta.mensagem
            : 'Não foi possível carregar a playlist.'
        );

        return;
      }


      playlist =
        Array.isArray(resposta.playlist)
          ? resposta.playlist
          : [];


      status.textContent =
        playlist.length +
        ' áudio' +
        (playlist.length === 1 ? '' : 's') +
        ' disponível' +
        (playlist.length === 1 ? '' : 'is');


      aplicarFiltro();


    })


    .withFailureHandler(function(erro) {

      mostrarErro(
        erro &&
        erro.message
          ? erro.message
          : String(erro)
      );

    })


    .listarPlaylist();
}


/* =========================================================
   FILTRO
   ========================================================= */

function filtrar(tipo, botao) {

  filtroAtual = tipo;


  document
    .querySelectorAll('.filter')
    .forEach(function(item) {

      item.classList.remove('active');

    });


  if (botao) {
    botao.classList.add('active');
  }


  aplicarFiltro();
}


/* =========================================================
   APLICA FILTRO
   ========================================================= */

function aplicarFiltro() {

  if (filtroAtual === 'todos') {

    playlistFiltrada =
      playlist.slice();

  } else {

    playlistFiltrada =
      playlist.filter(function(item) {

        return normalizarTipo(item.tipo)
          === filtroAtual;

      });
  }


  indiceAtual = -1;

  renderizarPlaylist();
}


/* =========================================================
   NORMALIZA TIPO
   ========================================================= */

function normalizarTipo(tipo) {

  return String(tipo || 'musica')
    .trim()
    .toLowerCase()
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g, '');
}


/* =========================================================
   RENDERIZA
   ========================================================= */

function renderizarPlaylist() {

  lista.innerHTML = '';


  if (!playlistFiltrada.length) {

    lista.innerHTML = `
      <div class="message">
        Nenhum áudio encontrado.
      </div>
    `;

    return;
  }


  playlistFiltrada.forEach(function(item, index) {

    const div =
      document.createElement('div');


    div.className =
      'audio-item';


    div.dataset.index =
      index;


    const tipo =
      item.tipo || 'Música';


    const artista =
      item.artista || 'Rádio Onda Livre';


    div.innerHTML = `

      <div class="number">
        ${index + 1}
      </div>

      <div class="audio-info">

        <div class="audio-title">
          ${escaparHtml(item.titulo)}
        </div>

        <div class="audio-artist">
          ${escaparHtml(artista)}
        </div>

      </div>

      <div class="audio-type">
        ${escaparHtml(tipo)}
      </div>

    `;


    div.addEventListener(
      'click',
      function() {

        tocar(index);

      }
    );


    lista.appendChild(div);

  });
}


/* =========================================================
   TOCAR
   ========================================================= */

function tocar(index) {

  if (
    index < 0 ||
    index >= playlistFiltrada.length
  ) {
    return;
  }

  indiceAtual = index;

  const item = playlistFiltrada[index];

  if (!item.url) {

    status.textContent =
      'Este áudio não possui uma URL válida.';

    return;
  }

  currentTitle.textContent =
    item.titulo || 'Áudio sem título';

  currentArtist.textContent =
    item.artista || 'Rádio Onda Livre';

  currentType.textContent =
    item.tipo || 'Música';

  /*
   * Define o endereço diretamente.
   */
  player.src = item.url;

  /*
   * Recarrega o elemento de áudio.
   */
  player.load();

  /*
   * Tenta iniciar a reprodução.
   */
  const reproducao = player.play();

  if (reproducao !== undefined) {

    reproducao.catch(function(erro) {

      console.warn(
        'Reprodução automática bloqueada:',
        erro
      );

      status.textContent =
        'Clique no botão ▶ do player para iniciar.';
    });
  }

  atualizarItemAtivo();
}


/* =========================================================
   ANTERIOR
   ========================================================= */

function anterior() {

  if (!playlistFiltrada.length) {
    return;
  }


  let novoIndice =
    indiceAtual - 1;


  if (novoIndice < 0) {
    novoIndice =
      playlistFiltrada.length - 1;
  }


  tocar(novoIndice);
}


/* =========================================================
   PRÓXIMO
   ========================================================= */

function proximo() {

  if (!playlistFiltrada.length) {
    return;
  }


  let novoIndice =
    indiceAtual + 1;


  if (
    novoIndice >=
    playlistFiltrada.length
  ) {
    novoIndice = 0;
  }


  tocar(novoIndice);
}


/* =========================================================
   QUANDO TERMINAR
   ========================================================= */

player.addEventListener(
  'ended',
  function() {

    proximo();

  }
);
player.addEventListener(
  'error',
  function() {

    const erro =
      player.error;

    let mensagem =
      'Não foi possível reproduzir este áudio.';

    if (erro) {

      switch (erro.code) {

        case 1:
          mensagem =
            'A reprodução foi interrompida.';
          break;

        case 2:
          mensagem =
            'Erro de rede ao carregar o áudio.';
          break;

        case 3:
          mensagem =
            'O arquivo de áudio não pôde ser decodificado.';
          break;

        case 4:
          mensagem =
            'O formato ou endereço do áudio não é suportado.';
          break;
      }
    }

    status.textContent =
      mensagem;

    console.error(
      'Erro no áudio:',
      mensagem,
      player.src
    );

  }
);

/* =========================================================
   ITEM ATIVO
   ========================================================= */

function atualizarItemAtivo() {

  document
    .querySelectorAll('.audio-item')
    .forEach(function(item) {

      item.classList.remove('active');

    });


  const item =
    document.querySelector(
      '.audio-item[data-index="' +
      indiceAtual +
      '"]'
    );


  if (item) {

    item.classList.add('active');

  }
}


/* =========================================================
   ERRO
   ========================================================= */

function mostrarErro(mensagem) {

  status.textContent =
    'Erro ao carregar';


  lista.innerHTML = `

    <div class="message error">

      <strong>
        Não foi possível carregar a playlist.
      </strong>

      <br><br>

      ${escaparHtml(mensagem)}

    </div>

  `;

}


/* =========================================================
   ESCAPA HTML
   ========================================================= */

function escaparHtml(valor) {

  return String(valor || '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');

}

</script>


</body>

</html>
